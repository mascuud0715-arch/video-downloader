<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Downloader</title>

<style>

body{
background:#0a1a2f;
font-family:Arial;
color:white;
text-align:center;
margin:0;
}

.container{
padding:30px;
}

h1{
margin-top:40px;
}

input{
width:90%;
padding:15px;
border-radius:25px;
border:none;
font-size:16px;
margin-top:20px;
}

button{
background:#4a86e8;
border:none;
padding:15px;
width:90%;
color:white;
font-size:18px;
border-radius:30px;
margin-top:20px;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
background:#081425;
display:flex;
justify-content:space-around;
padding:15px 0;
}

a{
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>Video Downloader</h1>

<p>Paste TikTok, Instagram or Pinterest link</p>

<form method="POST">

<input type="text" name="url" placeholder="Paste video link here..." required>

<br>

<button type="submit">Download</button>

</form>

</div>

<div class="bottom">

<a href="/">Home</a>

<a href="/downloads">Downloads</a>

</div>

</body>
</html>
